[project]
name = "ai-agent-challenge"
version = "0.1.0"
description = "Grounded document-QA agent — AI engineering take-home starter repo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
# Anchor imports to the repo root so `pytest` works from anywhere and
# `python -m eval.runner` / `from app...` resolve consistently.
pythonpath = ["."]
testpaths = ["tests"]
# NOTE: deliberately NOT `filterwarnings = ["error"]` — a strict-warnings
# policy would turn benign stdlib/pydantic deprecations into red tests and
# undermine the "green out of the box" guarantee.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This is a runnable app, not a distributable library; skip package discovery.
py-modules = []
